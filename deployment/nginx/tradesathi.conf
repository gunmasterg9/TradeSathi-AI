# TradeSathi AI — Production Nginx Reverse Proxy & Rate Limiting Configuration
# File: deployment/nginx/tradesathi.conf
#
# Directs HTTPS traffic, terminates TLS 1.3, serves frontend static assets,
# enforces rate limits on authentication endpoints, and proxies API traffic
# strictly to local loopback (127.0.0.1:8000).

# -----------------------------------------------------------------------------
# Rate Limiting Zones (Defense-in-Depth against Brute-Force & Denial-of-Service)
# -----------------------------------------------------------------------------

# Zone 1: Sensitive authentication endpoints (max 5 requests/minute per client IP)
limit_req_zone $binary_remote_addr zone=tradesathi_auth_limit:10m rate=5r/m;

# Zone 2: General API endpoints (max 30 requests/second per client IP)
limit_req_zone $binary_remote_addr zone=tradesathi_api_limit:10m rate=30r/s;

# -----------------------------------------------------------------------------
# HTTP -> HTTPS Redirect
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name tradesathi.yourdomain.com;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# Production HTTPS Server
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tradesathi.yourdomain.com;

    # TLS Certificates (Provided by Let's Encrypt / DigiCert)
    ssl_certificate /etc/letsencrypt/live/tradesathi.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tradesathi.yourdomain.com/privkey.pem;

    # Modern TLS Security Controls
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Upload Limits (aligned with MAX_UPLOAD_MB=10)
    client_max_body_size 12M;

    # Root Directory for Pre-Built Production Frontend Assets
    root /var/www/tradesathi/frontend/dist;
    index index.html;

    # 1. Frontend SPA Static Asset Delivery
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Static build asset hashing (Vite dist/assets/*)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 2. General API Reverse Proxy
    location /api/ {
        limit_req zone=tradesathi_api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Forwarded Client Headers (Trusted by Uvicorn --forwarded-allow-ips=127.0.0.1)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for document OCR and processing
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 3. Sensitive Authentication Endpoints (Stricter Rate Limiting)
    location ~* ^/api/(auth/login|portal/auth/login|portal/invitations/accept) {
        limit_req zone=tradesathi_auth_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Health & Monitoring Probes (No rate limiting for load balancer probes)
    location ~* ^/(health/live|health/ready) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        access_log off;
    }
}
